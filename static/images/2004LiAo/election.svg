<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="2004 ROC presidential election"><title>2004 ROC presidential election</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b9431"/><stop offset="0.35" stop-color="#e3b505"/><stop offset="0.7" stop-color="#1e3fbf"/><stop offset="1" stop-color="#ff6310"/></linearGradient></defs>
<rect width="600" height="320" fill="#1d1a17"/>
<rect y="0" width="600" height="14" fill="url(#g)"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#fff" text-anchor="middle">
  <text x="300" y="80" font-size="18" letter-spacing="5" fill="#e8c76a" font-family="'Helvetica Neue', Arial, sans-serif">MARCH 20, 2004</text>
  <text x="300" y="134" font-size="40" font-weight="700">The Biggest Election</text>
  <text x="300" y="172" font-size="22" fill="#ddd">in Taiwanese history</text>
  <text x="300" y="214" font-size="17" fill="#bbb" font-style="italic">One incumbent. One accident. Four years to make it count.</text>
</g>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
  <rect x="24" y="252" width="126" height="34" fill="#1b9431"/><text x="87" y="275" fill="#fff">GREEN</text>
  <rect x="160" y="246" width="136" height="46" fill="#e3b505"/><text x="228" y="275" fill="#1d1a17">LI AO</text>
  <rect x="306" y="252" width="126" height="34" fill="#1e3fbf"/><text x="369" y="275" fill="#fff">BLUE</text>
  <rect x="442" y="252" width="134" height="34" fill="#ff6310"/><text x="509" y="275" fill="#fff">ORANGE?</text>
</g>
</svg>
